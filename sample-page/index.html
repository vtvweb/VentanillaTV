<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirigiendo... - Ventanilla TV</title>
    <meta http-equiv="refresh" content="0; url=https://ventanillatv.pe/historia/">
    <link rel="canonical" href="https://ventanillatv.pe/historia/">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" href="https://ventanillatv.pe/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="https://ventanillatv.pe/favicon.svg" />
    <link rel="shortcut icon" href="https://ventanillatv.pe/favicon.ico" />
    <script>
        (function() {
            var target = "https://ventanillatv.pe/historia/";
            var query = window.location.search || "";
            var hash = window.location.hash || "";
            window.location.replace(target + query + hash);
        })();
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            background: #0d1322;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .vtv-redirect-card {
            background: #151f38;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 44px 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 24px 38px 3px rgba(0, 0, 0, 0.45);
        }
        .vtv-spinner {
            width: 46px;
            height: 46px;
            border: 3.5px solid rgba(255, 255, 255, 0.12);
            border-top-color: #2196f3;
            border-radius: 50%;
            animation: vtvSpin 0.75s linear infinite;
            margin: 0 auto 22px;
        }
        @keyframes vtvSpin { to { transform: rotate(360deg); } }
        .vtv-redirect-title {
            font-size: 1.45rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
        }
        .vtv-redirect-desc {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.55;
            margin-bottom: 26px;
        }
        .vtv-redirect-btn {
            display: inline-block;
            background: #2196f3;
            color: #ffffff;
            padding: 13px 26px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s, transform 0.15s;
        }
        .vtv-redirect-btn:hover {
            background: #1976d2;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="vtv-redirect-card">
        <div class="vtv-spinner"></div>
        <h1 class="vtv-redirect-title">Redirigiendo...</h1>
        <p class="vtv-redirect-desc">Está siendo redirigido automáticamente a la nueva página oficial de Ventanilla TV.</p>
        <a href="https://ventanillatv.pe/historia/" class="vtv-redirect-btn">Haga clic aquí si no es redirigido automáticamente</a>
    </div>
</body>
</html>
